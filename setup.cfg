[flake8]
# Colaboração entre Flake8 e Black: a largura máxima de linha padrão do Black é 88
max-line-length = 88

# Códigos de erro a serem ignorados por conflito de estilo com o Black:
# E203: espaço em branco antes de ':' (Black coloca espaços em fatiamentos, ex: x[1:2])
# E402: imports condicionais do pacote para execução direta do módulo
# W503: quebra de linha antes de operador binário (Black incentiva quebra antes de operadores)
ignore = E203, E402, W503, F401

# Pastas a serem ignoradas na análise de estilo
exclude =
    .git,
    __pycache__,
    .ipynb_checkpoints,
    data,
    docs,
    models,
    notebooks,
    reports,
    venv,
    .venv,
    env,
    .env,
    build,
    dist

# Estatísticas e formatação do relatório
show-source = True
statistics = True
count = True
